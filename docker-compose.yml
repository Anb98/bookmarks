# Bookmarks — https://github.com/Anb98/bookmarks
#
#   mkdir -p data && docker compose up -d
#
# Create data/ yourself first. If Docker creates it, it is owned by root and
# the container cannot write the database.

services:
  bookmarks:
    image: ghcr.io/anb98/bookmarks:latest
    container_name: bookmarks
    restart: unless-stopped

    ports:
      - "${BOOKMARKS_PORT:-8080}:8080"

    # Must match the owner of ./data. Override in a .env file next to this one.
    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      - ./data:/data

    environment:
      BOOKMARKS_ADDR: ":8080"
      BOOKMARKS_DB: "/data/bookmarks.db"
      BOOKMARKS_THEME: "dark"
      BOOKMARKS_ALLOW_PRIVATE_NET: "false"
      BOOKMARKS_FETCH_TIMEOUT: "8s"
      BOOKMARKS_MAX_FETCH_BYTES: "1048576"
      BOOKMARKS_MAX_FAVICON_BYTES: "65536"
      BOOKMARKS_MAX_IMPORT_BYTES: "33554432"
      BOOKMARKS_USER_AGENT: "Mozilla/5.0 (compatible; bookmarks/1.0)"
