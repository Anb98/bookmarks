name: Docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # A broken image must never reach the registry, so the suite gates the build.
      - name: Test
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Lowercased on purpose: the owner is "Anb98" but GHCR rejects
          # uppercase in an image name, so ${{ github.repository }} would fail.
          tags: |
            ghcr.io/anb98/bookmarks:latest
            ghcr.io/anb98/bookmarks:${{ github.sha }}
